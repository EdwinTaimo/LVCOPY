<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Espacial -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Gradiente Alien/Tech -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Símbolo / Isotipo -->
  <g transform="translate(310, 140)">
    <!-- Letra 'E' estilizada como lado esquerdo de um D-Pad -->
    <path d="M 60 20 L 20 20 L 20 60 L 0 60 L 0 100 L 20 100 L 20 140 L 60 140 L 60 110 L 35 110 L 35 50 L 60 50 Z" fill="url(#accent)"/>
    
    <!-- Letra 'T' estilizada como centro/topo -->
    <path d="M 80 20 L 160 20 L 160 50 L 135 50 L 135 140 L 105 140 L 105 50 L 80 50 Z" fill="#F8FAFC"/>
    
    <!-- Botões de Ação de Controle -->
    <circle cx="160" cy="110" r="12" fill="#F8FAFC"/>
    <circle cx="190" cy="80" r="12" fill="url(#accent)"/>
  </g>

  <!-- Tipografia -->
  <text x="400" y="390" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="8">ET TOY'S</text>
  
  <!-- Subtítulo / Slogan -->
  <text x="400" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="14">GAMES &amp; ENTERTAINMENT</text>
</svg>
